
name: Build Free API Radar APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'FreeApiRadar-Umbrella-Umbra-Watch-1.3.zip'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Umbra Watch 1.3
        run: |
          unzip -q FreeApiRadar-Umbrella-Umbra-Watch-1.3.zip -d source
          test -f source/FreeApiRadar/app/build.gradle.kts
          test -f source/FreeApiRadar/build.gradle.kts
          test -f source/FreeApiRadar/app/src/main/AndroidManifest.xml

      - name: Build APK
        working-directory: source/FreeApiRadar
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FreeApiRadar-debug-apk
          path: source/FreeApiRadar/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
