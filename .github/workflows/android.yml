
name: Build Free API Radar APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'FreeApiRadar-Umbrella-Umbra-Watch-1.3.zip'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android SDK Manager
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found in $ANDROID_HOME/cmdline-tools"
            exit 1
          fi
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "Using SDK manager: $SDKMANAGER"
          "$SDKMANAGER" --version

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -o pipefail
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses || true

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "Android SDK installation attempt $attempt of 3"
            if "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
              "platform-tools" \
              "platforms;android-35" \
              "build-tools;35.0.0"; then
              echo "Android SDK packages installed successfully."
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Installation failed. Retrying in 15 seconds..."
              sleep 15
            fi
          done
          echo "ERROR: Android SDK installation failed after 3 attempts."
          exit 1

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Umbra Watch 1.3
        shell: bash
        run: |
          set -euo pipefail
          unzip -q FreeApiRadar-Umbrella-Umbra-Watch-1.3.zip -d source
          test -f source/FreeApiRadar/app/build.gradle.kts
          test -f source/FreeApiRadar/build.gradle.kts
          test -f source/FreeApiRadar/app/src/main/AndroidManifest.xml

      - name: Build APK
        working-directory: source/FreeApiRadar
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FreeApiRadar-debug-apk
          path: source/FreeApiRadar/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
