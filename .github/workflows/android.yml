
name: Build Free API Radar APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'FreeApiRadar-Android-Source.zip'
      - '.github/workflows/android.yml'
      - 'android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-35
            build-tools;35.0.0
          accept-android-sdk-licenses: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          unzip -q FreeApiRadar-Android-Source.zip -d source
          test -f source/FreeApiRadar/app/build.gradle.kts

      - name: Build APK
        working-directory: source/FreeApiRadar
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FreeApiRadar-debug-apk
          path: source/FreeApiRadar/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
