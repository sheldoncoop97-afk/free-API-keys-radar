name: Build Umbrella Corp APK

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/android.yml'

permissions:
  contents: read

concurrency:
  group: umbrella-android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 35

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found in $ANDROID_HOME/cmdline-tools" >&2
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Find and extract Android project ZIP
        id: project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/umbrella-project"
          ZIP=""
          for CANDIDATE in \
            "Umbrella-Corp-Android-Project-Professional.zip" \
            "Umbrella-Corp-Android-Project-Visual-Refresh.zip" \
            "Umbrella-Corp-Android-Project.zip"; do
            if [ -f "$CANDIDATE" ]; then ZIP="$CANDIDATE"; break; fi
          done
          if [ -z "$ZIP" ]; then
            ZIP="$(find . -maxdepth 1 -type f -name '*.zip' -printf '%f\n' | sort | head -n 1)"
          fi
          if [ -z "$ZIP" ] || [ ! -f "$ZIP" ]; then
            echo "ERROR: No project ZIP found in repository root." >&2
            ls -la
            exit 1
          fi
          echo "Selected project archive: $ZIP"
          unzip -q "$ZIP" -d "$RUNNER_TEMP/umbrella-project"
          PROJECT=""
          while IFS= read -r SETTINGS; do
            DIR="$(dirname "$SETTINGS")"
            if { [ -f "$DIR/app/build.gradle" ] || [ -f "$DIR/app/build.gradle.kts" ]; } \
              && { [ -f "$DIR/settings.gradle" ] || [ -f "$DIR/settings.gradle.kts" ]; }; then
              PROJECT="$DIR"
              break
            fi
          done < <(find "$RUNNER_TEMP/umbrella-project" -type f \( -name settings.gradle -o -name settings.gradle.kts \) | sort)
          if [ -z "$PROJECT" ]; then
            echo "ERROR: Could not locate an Android Gradle project with settings.gradle and app/build.gradle(.kts)." >&2
            find "$RUNNER_TEMP/umbrella-project" -maxdepth 6 -type f | head -200
            exit 1
          fi
          echo "project_dir=$PROJECT" >> "$GITHUB_OUTPUT"
          echo "Found project at: $PROJECT"

      - name: Build debug APK
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle assembleDebug --stacktrace

      - name: Verify APK exists
        id: apk
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        run: |
          set -euo pipefail
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -s "$APK" ]; then
            echo "ERROR: APK missing or empty: $APK" >&2
            find "$PROJECT_DIR/app/build/outputs" -maxdepth 6 -type f 2>/dev/null || true
            exit 1
          fi
          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"
          sha256sum "$APK"
          ls -lh "$APK"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Umbrella-Corp-debug-apk
          path: ${{ steps.apk.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 14
