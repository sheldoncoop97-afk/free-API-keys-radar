
name: Build Free API Radar APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'FreeApiRadar-Android-Source.zip'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android SDK Manager
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "Found: $SDKMANAGER"

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          yes | "$SDKMANAGER" --licenses || true

      - name: Install Android SDK packages
        run: |
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          unzip -q FreeApiRadar-Android-Source.zip -d source
          test -f source/FreeApiRadar/app/build.gradle.kts

      - name: Fix Kotlin plugin versions
        shell: bash
        run: |
          cd source/FreeApiRadar
          sed -i 's/id("org.jetbrains.kotlin.kapt") version "2.0.21" apply false/id("org.jetbrains.kotlin.kapt") version "1.9.25" apply false/' build.gradle.kts
          echo "Root Gradle configuration:"
          cat build.gradle.kts
          grep -q 'org.jetbrains.kotlin.kapt.*1.9.25' build.gradle.kts

      - name: Build APK
        working-directory: source/FreeApiRadar
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FreeApiRadar-debug-apk
          path: source/FreeApiRadar/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
