
name: Build Free API Radar APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'FreeApiRadar-Umbrella-Umbra-Watch-1.3.zip'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android SDK Manager
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          "$SDKMANAGER" --version

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -o pipefail
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses || true

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
              "platform-tools" \
              "platforms;android-35" \
              "build-tools;35.0.0"; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "SDK installation failed; retrying..."
              sleep 15
            fi
          done
          echo "ERROR: Android SDK installation failed."
          exit 1

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Umbra Watch 1.3
        shell: bash
        run: |
          set -euo pipefail
          unzip -q FreeApiRadar-Umbrella-Umbra-Watch-1.3.zip -d source
          test -f source/FreeApiRadar/app/build.gradle.kts
          test -f source/FreeApiRadar/app/src/main/java/com/example/freeapiradar/MainActivity.kt

      - name: Fix openWebsite callback
        shell: bash
        run: |
          set -euo pipefail
          FILE="source/FreeApiRadar/app/src/main/java/com/example/freeapiradar/MainActivity.kt"

          python3 - "$FILE" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          text = path.read_text(encoding="utf-8")

          old_call = "RadarScreen(ApiRepository(applicationContext), ::runScan)"
          new_call = "RadarScreen(ApiRepository(applicationContext), ::runScan, ::openWebsite)"

          old_signature = "private fun RadarScreen(repo: ApiRepository, onScan: () -> Unit)"
          new_signature = "private fun RadarScreen(repo: ApiRepository, onScan: () -> Unit, openWebsite: (String) -> Unit)"

          if new_call not in text:
              if old_call not in text:
                  raise SystemExit("ERROR: RadarScreen call was not found; source differs from expected version.")
              text = text.replace(old_call, new_call, 1)

          if new_signature not in text:
              if old_signature not in text:
                  raise SystemExit("ERROR: RadarScreen declaration was not found; source differs from expected version.")
              text = text.replace(old_signature, new_signature, 1)

          if "onOpenWebsite = { openWebsite(entry.docsUrl) }" not in text:
              raise SystemExit("ERROR: Expected website callback was not found.")

          path.write_text(text, encoding="utf-8")
          print("Patched RadarScreen to receive the openWebsite callback.")
          PY

      - name: Build APK
        working-directory: source/FreeApiRadar
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FreeApiRadar-debug-apk
          path: source/FreeApiRadar/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
