
name: Build Umbrella Corp APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'Umbrella-Corp-Android-Project-Visual-Refresh.zip'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager | sort -V | tail -n 1)"

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found in $ANDROID_HOME/cmdline-tools"
            exit 1
          fi

          echo "Using sdkmanager: $SDKMANAGER"

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract and locate Umbrella project
        shell: bash
        run: |
          set -euo pipefail

          ZIP="Umbrella-Corp-Android-Project-Visual-Refresh.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: Missing ZIP: $ZIP"
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/umbrella-project"
          unzip -q "$ZIP" -d "$RUNNER_TEMP/umbrella-project"

          PROJECT=""

          while IFS= read -r FILE; do
            DIR="$(dirname "$FILE")"

            if [ -f "$DIR/app/build.gradle" ] || \
               [ -f "$DIR/app/build.gradle.kts" ]; then
              PROJECT="$DIR"
              break
            fi
          done < <(
            find "$RUNNER_TEMP/umbrella-project" \
              -type f \
              \( -name settings.gradle -o -name settings.gradle.kts \)
          )

          if [ -z "$PROJECT" ]; then
            echo "ERROR: Android project not found in ZIP."
            echo "Expected settings.gradle and app/build.gradle."
            echo "Files found in ZIP:"
            find "$RUNNER_TEMP/umbrella-project" \
              -maxdepth 5 -type f | head -200
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"
          echo "Found Android project: $PROJECT"

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Umbrella-Corp-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
